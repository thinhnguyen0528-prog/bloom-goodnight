<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>BLOOM.exe — A Flower Before Bedtime</title>
    <meta
      name="description"
      content="A romantic interactive floral gift with a multi-stage blooming SVG bouquet and a gentle Vietnamese goodnight message."
    />
    <meta property="og:title" content="BLOOM.exe — A Flower Before Bedtime" />
    <meta
      property="og:description"
      content="Món quà nhỏ nở hoa dịu dàng nhắc bé yêu đi ngủ sớm mỗi tối."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080D24" id="theme-color-meta" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono (Full Vietnamese Support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --galaxy-navy: #080d24;
        --galaxy-indigo: #171735;
        --galaxy-purple: #30204f;
        --soft-pink: #ffb6d5;
        --warm-white: #fff5f8;
        --lavender-glow: #a88bff;

        --bg-night-top: #050817;
        --bg-night-mid: #080d24;
        --bg-night-bottom: #171735;

        --glass-bg: rgba(15, 18, 42, 0.72);
        --glass-bg-soft: rgba(23, 23, 53, 0.66);
        --glass-border: rgba(255, 182, 213, 0.18);
        --glass-highlight: rgba(168, 139, 255, 0.34);

        --text-primary: #fff5f8;
        --text-secondary: rgba(255, 245, 248, 0.88);
        --text-muted: rgba(255, 182, 213, 0.74);

        --accent-pink: #ffb6d5;
        --accent-coral: #f0597a;
        --accent-warm: #ffd166;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--text-primary);
        background-color: var(--galaxy-navy);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Layered Galaxy & Nebula Background System */
      .scene-backgrounds {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bg-sage {
        background:
          radial-gradient(
            circle at 28% 24%,
            rgba(168, 139, 255, 0.22) 0%,
            rgba(48, 32, 79, 0.18) 38%,
            transparent 68%
          ),
          radial-gradient(
            circle at 72% 32%,
            rgba(255, 182, 213, 0.18) 0%,
            rgba(168, 139, 255, 0.1) 42%,
            transparent 70%
          ),
          radial-gradient(
            ellipse at 50% 55%,
            rgba(48, 32, 79, 0.65) 0%,
            rgba(23, 23, 53, 0.4) 55%,
            transparent 85%
          ),
          linear-gradient(
            180deg,
            var(--galaxy-navy) 0%,
            var(--galaxy-indigo) 50%,
            var(--galaxy-purple) 100%
          );
        opacity: 1;
      }

      .bg-night {
        background:
          radial-gradient(
            circle at 50% 34%,
            rgba(168, 139, 255, 0.26) 0%,
            rgba(255, 182, 213, 0.16) 36%,
            transparent 70%
          ),
          radial-gradient(
            circle at 80% 18%,
            rgba(255, 245, 248, 0.1) 0%,
            transparent 50%
          ),
          linear-gradient(
            180deg,
            var(--bg-night-top) 0%,
            var(--galaxy-navy) 48%,
            var(--galaxy-indigo) 82%,
            var(--galaxy-purple) 100%
          );
        opacity: 0;
      }

      body.is-night .bg-sage {
        opacity: 0.25;
      }

      body.is-night .bg-night {
        opacity: 1;
      }

      /* Ambient Canvas for Floating Petals, Stars & Fireflies */
      #ambient-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      /* Night Sky SVG Layer (Crescent Moon & Nebula Glow - Always Visible in Galaxy Theme) */
      .night-sky-decor {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.9;
        transform: translateY(0);
        transition:
          opacity 2.4s cubic-bezier(0.22, 1, 0.36, 1),
          transform 2.4s cubic-bezier(0.22, 1, 0.36, 1),
          filter 2.4s ease;
      }

      body.is-night .night-sky-decor {
        opacity: 1;
        filter: drop-shadow(0 0 18px rgba(255, 182, 213, 0.35));
      }

      .crescent-moon-wrapper {
        position: absolute;
        top: clamp(2.8rem, 6vh, 4.5rem);
        right: clamp(1.5rem, 8vw, 7rem);
        width: clamp(64px, 9vw, 92px);
        height: clamp(64px, 9vw, 92px);
        filter: drop-shadow(0 0 28px rgba(255, 245, 248, 0.55))
          drop-shadow(0 0 54px rgba(168, 139, 255, 0.4));
        animation: moonFloat 7s ease-in-out infinite alternate;
      }

      @keyframes moonFloat {
        0% {
          transform: translateY(0px) rotate(-4deg);
        }
        100% {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      /* Top Bar (Clean 3-Zone Contract) */
      .top-bar {
        position: relative;
        z-index: 20;
        max-width: 1240px;
        margin: 0 auto;
        padding: 1rem 1.25rem 0.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.92);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .stage-progress-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.75);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-replay-btn {
        appearance: none;
        background: var(--glass-bg-soft);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0.5rem 0.9rem;
        min-height: 40px;
        border-radius: 0.75rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        white-space: nowrap;
        flex-shrink: 0;
        transition:
          transform 160ms var(--ease-out-expo),
          background-color 160ms ease,
          border-color 160ms ease;
      }

      .top-replay-btn:hover {
        background: rgba(15, 23, 42, 0.88);
        border-color: var(--glass-highlight);
        transform: translateY(-1px);
      }

      .top-replay-btn:active {
        transform: scale(0.97);
      }

      .top-replay-btn:focus-visible {
        outline: 2px solid var(--accent-pink);
        outline-offset: 2px;
      }

      /* Main Interactive Stage Layout */
      .app-stage {
        position: relative;
        z-index: 10;
        max-width: 1240px;
        min-height: calc(100dvh - 64px);
        margin: 0 auto;
        padding: 0.5rem 1.25rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
      }

      @media (min-width: 1024px) {
        .app-stage {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 3.5rem;
          padding: 1rem 2.5rem 2.5rem;
        }
      }

      /* Bouquet Visual Column */
      .bouquet-showcase {
        position: relative;
        width: 100%;
        max-width: 490px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      @media (min-width: 1024px) {
        .bouquet-showcase {
          width: 52%;
          max-width: 540px;
        }
      }

      /* Ambient Radial Aura Behind Bouquet (Soft Pink & Lavender Galaxy Glow) */
      .bouquet-aura {
        position: absolute;
        width: 86%;
        height: 76%;
        top: 8%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 182, 213, 0.34) 0%,
          rgba(168, 139, 255, 0.24) 44%,
          rgba(48, 32, 79, 0.12) 66%,
          transparent 78%
        );
        filter: blur(28px);
        opacity: 0.72;
        transform: scale(0.92);
        transition:
          opacity 1.8s ease,
          transform 1.8s ease,
          background 1.8s ease;
        pointer-events: none;
      }

      .bouquet-showcase.aura-visible .bouquet-aura {
        opacity: 0.96;
        transform: scale(1.04);
      }

      body.is-night .bouquet-showcase .bouquet-aura {
        opacity: 1;
        transform: scale(1.16);
        background: radial-gradient(
          circle,
          rgba(255, 182, 213, 0.44) 0%,
          rgba(168, 139, 255, 0.32) 42%,
          rgba(255, 245, 248, 0.14) 64%,
          transparent 80%
        );
      }

      /* Main Bouquet SVG Container */
      .bouquet-svg-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 600 / 690;
        max-height: 54dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 22px rgba(255, 182, 213, 0.2))
          drop-shadow(0 0 44px rgba(168, 139, 255, 0.16));
        transition: filter 1.6s ease;
      }

      @media (min-width: 1024px) {
        .bouquet-svg-wrapper {
          max-height: 76dvh;
        }
      }

      body.is-night .bouquet-svg-wrapper {
        filter: drop-shadow(0 0 32px rgba(255, 182, 213, 0.38))
          drop-shadow(0 0 68px rgba(168, 139, 255, 0.28));
      }

      #bouquet-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        transform-origin: 300px 610px;
      }

      #bouquet-svg.swaying {
        animation: gentleBouquetSway 6.5s ease-in-out infinite alternate;
      }

      @keyframes gentleBouquetSway {
        0% {
          transform: rotate(-0.85deg) translateY(0px);
        }
        100% {
          transform: rotate(0.85deg) translateY(-4px);
        }
      }

      /* Stage 1 Whisper Banner (Above/Below Bouquet during Stage 1-4) */
      .stage-whisper-pill {
        margin-top: -0.35rem;
        padding: 0.65rem 1.2rem;
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
        font-size: 0.94rem;
        font-weight: 500;
        color: var(--text-primary);
        text-align: center;
        letter-spacing: 0.01em;
        box-shadow: 0 12px 32px -8px rgba(7, 12, 26, 0.36);
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 600ms var(--ease-out-expo),
          transform 600ms var(--ease-out-expo);
      }

      .stage-whisper-pill.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* SVG Element Animation Classes */
      .wrapper-cone-group {
        opacity: 0;
        transform: translateY(22px) scale(0.95);
        transform-origin: 300px 580px;
        transition:
          opacity 900ms var(--ease-out-expo),
          transform 900ms var(--ease-out-expo);
      }

      .wrapper-cone-group.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .backdrop-foliage-leaf {
        opacity: 0;
        transform: scale(0.15);
        transition:
          opacity 850ms var(--ease-out-expo),
          transform 1050ms var(--ease-out-expo);
      }

      .backdrop-foliage-leaf.active {
        opacity: 1;
        transform: scale(1);
      }

      .stem-path {
        stroke-dasharray: var(--stem-len, 400);
        stroke-dashoffset: var(--stem-len, 400);
        transition: stroke-dashoffset 1150ms cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .stem-path.active {
        stroke-dashoffset: 0;
      }

      .stem-leaf-item,
      .wheat-sprig-item {
        opacity: 0;
        transform: scale(0);
        transition:
          opacity 550ms ease,
          transform 750ms var(--ease-spring);
      }

      .stem-leaf-item.active,
      .wheat-sprig-item.active {
        opacity: 1;
        transform: scale(1);
      }

      .flower-bud-node {
        opacity: 0;
        transform: scale(0);
        transition:
          opacity 420ms ease,
          transform 620ms var(--ease-spring);
      }

      .flower-bud-node.active {
        opacity: 1;
        transform: scale(1);
      }

      .flower-bud-node.bloomed {
        opacity: 0;
        transform: scale(0.4);
        transition:
          opacity 350ms ease,
          transform 350ms ease;
      }

      .flower-head-node {
        opacity: 0;
        transform: scale(0.08) rotate(-18deg);
        transition:
          opacity 650ms var(--ease-out-expo),
          transform 950ms var(--ease-spring);
      }

      .flower-head-node.active {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }

      .flower-inner-ring {
        opacity: 0;
        transform: scale(0.2) rotate(15deg);
        transition:
          opacity 650ms var(--ease-out-expo) 140ms,
          transform 900ms var(--ease-spring) 140ms;
      }

      .flower-head-node.active .flower-inner-ring {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }

      .flower-core-group {
        opacity: 0;
        transform: scale(0.1);
        transition:
          opacity 500ms ease 260ms,
          transform 700ms var(--ease-spring) 260ms;
      }

      .flower-head-node.active .flower-core-group {
        opacity: 1;
        transform: scale(1);
      }

      /* Message & Interaction Column (Dark Sci-Fi Glassmorphism Card) */
      .message-column {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      @media (min-width: 1024px) {
        .message-column {
          width: 48%;
          max-width: 480px;
        }
      }

      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 1.35rem;
        padding: clamp(1.35rem, 3.5vw, 2rem);
        box-shadow:
          0 24px 48px -12px rgba(7, 12, 26, 0.45),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        transition:
          opacity 600ms var(--ease-out-expo),
          transform 600ms var(--ease-out-expo),
          border-color 800ms ease,
          box-shadow 800ms ease;
      }

      body.is-night .glass-card {
        border-color: rgba(244, 143, 177, 0.24);
        box-shadow:
          0 28px 60px -12px rgba(2, 6, 23, 0.78),
          0 0 36px -8px rgba(244, 143, 177, 0.16),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.16);
      }

      .card-header-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.9rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .message-title {
        font-size: clamp(1.22rem, 2.8vw, 1.5rem);
        font-weight: 700;
        line-height: 1.35;
        color: #ffffff;
        margin-bottom: 0.95rem;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }

      .message-paragraphs {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        font-size: clamp(0.94rem, 2vw, 1.02rem);
        line-height: 1.65;
        color: var(--text-secondary);
        min-height: 11.5rem;
      }

      body.is-night .message-paragraphs {
        min-height: 5.5rem;
      }

      .msg-para {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 650ms var(--ease-out-expo),
          transform 650ms var(--ease-out-expo);
      }

      .msg-para.revealed {
        opacity: 1;
        transform: translateY(0);
      }

      .msg-para.highlight-love {
        font-weight: 600;
        color: #ffe4ec;
      }

      /* Interactive CTA Buttons */
      .card-actions {
        margin-top: 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition:
          opacity 550ms var(--ease-out-expo),
          transform 550ms var(--ease-out-expo);
      }

      .card-actions.ready {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .primary-sleep-btn {
        appearance: none;
        width: 100%;
        min-height: 50px;
        padding: 0.85rem 1.35rem;
        border-radius: 0.95rem;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: linear-gradient(135deg, #ec487f 0%, #db2777 50%, #be185d 100%);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        box-shadow:
          0 12px 28px -6px rgba(219, 39, 119, 0.55),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.28);
        transition:
          transform 160ms var(--ease-out-expo),
          box-shadow 160ms ease,
          filter 160ms ease,
          opacity 160ms ease;
      }

      .primary-sleep-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow:
          0 16px 34px -6px rgba(219, 39, 119, 0.7),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.35);
        filter: brightness(1.05);
      }

      .primary-sleep-btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .primary-sleep-btn:disabled {
        opacity: 0.65;
        cursor: default;
      }

      .primary-sleep-btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 3px;
      }

      .secondary-restart-btn {
        appearance: none;
        width: 100%;
        min-height: 46px;
        padding: 0.75rem 1.2rem;
        border-radius: 0.9rem;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition:
          transform 160ms var(--ease-out-expo),
          background-color 160ms ease,
          border-color 160ms ease;
      }

      .secondary-restart-btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: var(--glass-highlight);
        transform: translateY(-1px);
      }

      .secondary-restart-btn:active {
        transform: scale(0.98);
      }

      .secondary-restart-btn:focus-visible {
        outline: 2px solid var(--accent-pink);
        outline-offset: 2px;
      }

      .hidden {
        display: none !important;
      }

      /* Reduced Motion Accessibility Support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 120ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Gradient Layers (Sage Day Reveal -> Midnight Goodnight) -->
    <div class="scene-backgrounds" aria-hidden="true">
      <div class="bg-layer bg-sage"></div>
      <div class="bg-layer bg-night"></div>
    </div>

    <!-- Night Sky Crescent Moon & Subtle Constellation SVG -->
    <div class="night-sky-decor" aria-hidden="true">
      <div class="crescent-moon-wrapper">
        <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none">
          <defs>
            <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFBEB" />
              <stop offset="55%" stop-color="#FDE68A" />
              <stop offset="100%" stop-color="#F59E0B" />
            </linearGradient>
          </defs>
          <path
            d="M66 16C46.5 20.2 33 37.8 34.2 58.2C35.4 78.6 51.8 94.2 72 95.2C53.2 100.4 32.8 92.4 22.8 75.4C12.8 58.4 16.4 36.6 31.2 23.6C41.2 14.8 54 12.8 66 16Z"
            fill="url(#moonGrad)"
          />
          <circle cx="24" cy="24" r="1.4" fill="#FEF3C7" opacity="0.85" />
          <circle cx="82" cy="36" r="1.1" fill="#FEF3C7" opacity="0.7" />
          <circle cx="15" cy="64" r="1.2" fill="#FEF3C7" opacity="0.6" />
        </svg>
      </div>
    </div>

    <!-- HTML5 Canvas for DeltaTime Floating Petals, Starlight & Separation Physics -->
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>

    <!-- Top Navigation Bar (Clean 3-Zone Contract) -->
    <header class="top-bar">
      <div class="brand-title">BLOOM.exe</div>
      <div class="stage-progress-text" id="stage-status-label" aria-live="polite">
        01 / Khởi tạo món quà nhỏ
      </div>
      <button
        type="button"
        class="top-replay-btn"
        id="top-replay-btn"
        aria-label="Xem lại hiệu ứng bó hoa nở từ đầu"
      >

      /**
       * Separation Algorithm for Flower Heads:
       * Ensures flowers maintain natural visual spacing without awkward overlap
       */
      function solveFlowerSeparation(flowers, iterations = 18) {
        const nodes = flowers.map((f, idx) => ({ ...f, id: idx }));
        for (let iter = 0; iter < iterations; iter++) {
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i];
              const b = nodes[j];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const dist = Math.hypot(dx, dy) || 0.001;
              const minDist = (a.r + b.r) * 0.78;
              if (dist < minDist) {
                const overlap = (minDist - dist) * 0.35;
                const nx = dx / dist;
                const ny = dy / dist;
                a.x -= nx * overlap;
                a.y -= ny * overlap;
                b.x += nx * overlap;
                b.y += ny * overlap;
              }
            }
          }
        }
        return nodes;
      }

            d: pathD,
            fill: 'none',
            stroke: stemColors[idx % stemColors.length],
            'stroke-width': (flower.r > 28 ? 3.4 : 2.5).toString(),
            'stroke-linecap': 'round',
            class: 'stem-path',
            style: `--stem-len: ${approxLen}; transition-delay: ${bloomRank * 26}ms;`
          });
          stemsLayer.appendChild(stemPath);

          // Stem Leaves along the curve (1 to 2 leaves per stem)
          const tValues = idx % 2 === 0 ? [0.46, 0.72] : [0.58];
          tValues.forEach((t, lIdx) => {
            const mt = 1 - t;
            const lx = mt * mt * startX + 2 * mt * t * ctrlX + t * t * flower.x;
            const ly = mt * mt * startY + 2 * mt * t * ctrlY + t * t * flower.y;
            const side = (idx + lIdx) % 2 === 0 ? 1 : -1;
            const leafAngle = side * 38 + (flower.x - 300) * 0.12;
            const leafColor = leafColors[(idx + lIdx) % leafColors.length];

            const leafGroup = createSvgElement('g', {
              class: 'stem-leaf-item',
              style: `transform-origin: ${lx.toFixed(1)}px ${ly.toFixed(1)}px; transition-delay: ${220 + bloomRank * 30 + lIdx * 90}ms;`
            });

            const leafBody = createSvgElement('path', {
              d: `M ${lx.toFixed(1)} ${ly.toFixed(1)} C ${(lx + side * 14).toFixed(1)} ${(ly - 14).toFixed(1)}, ${(lx + side * 26).toFixed(1)} ${(ly - 6).toFixed(1)}, ${(lx + side * 28).toFixed(1)} ${(ly - 22).toFixed(1)} C ${(lx + side * 14).toFixed(1)} ${(ly - 24).toFixed(1)}, ${(lx + side * 6).toFixed(1)} ${(ly - 10).toFixed(1)}, ${lx.toFixed(1)} ${ly.toFixed(1)} Z`,
              fill: leafColor,
              transform: `rotate(${leafAngle.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})`
            });

            leafGroup.appendChild(leafBody);
            leavesLayer.appendChild(leafGroup);
          });

          // Stage 3: Flower Bud at Stem Tip
          const budGroup = createSvgElement('g', {
            class: 'flower-bud-node',
            style: `transform-origin: ${flower.x.toFixed(1)}px ${flower.y.toFixed(1)}px; transition-delay: ${bloomRank * 28}ms;`
          });

          const budColor =
            flower.type === 'coral'
              ? '#F0597A'
              : flower.type === 'white'
                ? '#FFF8EB'
                : '#F6B8C4';

          const budCircle = createSvgElement('circle', {
            cx: flower.x.toFixed(1),
            cy: flower.y.toFixed(1),
            r: (flower.r * 0.28).toFixed(1),
            fill: budColor,
            stroke: '#356E47',
            'stroke-width': '1.8'
          });
          budGroup.appendChild(budCircle);
          budsLayer.appendChild(budGroup);

          // Stage 4: Full Multi-Layered Flower Head
          const flowerNode = buildFlowerHeadSvg(flower, bloomRank);
          flowersLayer.appendChild(flowerNode);
        });
      }

      /**
       * Builds an individual SVG Flower Head matching the 3 botanical varieties
       * in the reference image:
       * 1. 'coral': Ruffled hot-pink/coral cosmos with scalloped petals
       * 2. 'white': Warm cream-white multi-petal daisy with honey-gold center
       * 3. 'blush': Soft pastel pink 5-petal blossom with rose-coral center
       */
      function buildFlowerHeadSvg(flower, bloomRank) {
        const { x, y, r, type } = flower;
        const staggerDelay = bloomRank * 48;

        const rootG = createSvgElement('g', {
          class: 'flower-head-node',
          style: `transform-origin: ${x.toFixed(1)}px ${y.toFixed(1)}px; transition-delay: ${staggerDelay}ms;`
        });

        const localG = createSvgElement('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)})`
        });

        const outerRing = createSvgElement('g', { class: 'flower-outer-ring' });
        const innerRing = createSvgElement('g', {
          class: 'flower-inner-ring',
          style: 'transform-origin: 0px 0px;'
        });
        const coreGroup = createSvgElement('g', {
          class: 'flower-core-group',
          style: 'transform-origin: 0px 0px;'
        });

        if (type === 'coral') {
          // Ruffled Coral-Pink Cosmos (8 outer notched petals + 6 inner petals)
          const outerCount = 8;
          for (let i = 0; i < outerCount; i++) {
            const deg = (i * 360) / outerCount + (bloomRank % 3) * 7;
            const pLen = r * 0.98;
            const pWid = r * 0.44;
            const petal = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.35).toFixed(1)}, ${(-pWid * 0.85).toFixed(1)} ${(-pLen * 0.92).toFixed(1)}, ${(-pWid * 0.28).toFixed(1)} ${(-pLen).toFixed(1)} L 0 ${(-pLen * 0.88).toFixed(1)} L ${(pWid * 0.28).toFixed(1)} ${(-pLen).toFixed(1)} C ${(pWid * 0.85).toFixed(1)} ${(-pLen * 0.92).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.35).toFixed(1)}, 0 0 Z`,
              fill: i % 2 === 0 ? '#F0597A' : '#E84A6C',
              transform: `rotate(${deg.toFixed(1)})`
            });
            outerRing.appendChild(petal);
          }

          const innerCount = 6;
          for (let i = 0; i < innerCount; i++) {
            const deg = (i * 360) / innerCount + 25;
            const pLen = r * 0.72;
            const pWid = r * 0.34;
            const petal = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, ${(-pWid * 0.6).toFixed(1)} ${(-pLen).toFixed(1)}, 0 ${(-pLen * 0.92).toFixed(1)} C ${(pWid * 0.6).toFixed(1)} ${(-pLen).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, 0 0 Z`,
              fill: '#FF7090',
              transform: `rotate(${deg.toFixed(1)})`
            });
            innerRing.appendChild(petal);
          }

          // Center stamens & warm gold pollen dots
          const centerDisk = createSvgElement('circle', {
            cx: '0',
            cy: '0',
            r: (r * 0.16).toFixed(1),
            fill: '#C93B5B'
          });
          coreGroup.appendChild(centerDisk);

          for (let d = 0; d < 5; d++) {
            const a = (d * Math.PI * 2) / 5;
            const dot = createSvgElement('circle', {
              cx: (Math.cos(a) * r * 0.1).toFixed(1),
              cy: (Math.sin(a) * r * 0.1).toFixed(1),
              r: '1.7',
              fill: '#FFD166'
            });
            coreGroup.appendChild(dot);
          }
        } else if (type === 'white') {
          // Warm Cream-White Multi-Petal Daisy / Zinnia (12 outer + 10 inner petals)
          const outerCount = 12;
          for (let i = 0; i < outerCount; i++) {
            const deg = (i * 360) / outerCount;
            const pLen = r * 0.96;
            const pWid = r * 0.24;
            const petal = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.35).toFixed(1)}, ${(-pWid * 0.85).toFixed(1)} ${(-pLen).toFixed(1)}, 0 ${(-pLen).toFixed(1)} C ${(pWid * 0.85).toFixed(1)} ${(-pLen).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.35).toFixed(1)}, 0 0 Z`,
              fill: i % 2 === 0 ? '#FFFDF9' : '#F5EFE2',
              transform: `rotate(${deg.toFixed(1)})`
            });
            outerRing.appendChild(petal);
          }

          const innerCount = 10;
          for (let i = 0; i < innerCount; i++) {
            const deg = (i * 360) / innerCount + 15;
            const pLen = r * 0.72;
            const pWid = r * 0.2;
            const petal = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, ${(-pWid * 0.75).toFixed(1)} ${(-pLen).toFixed(1)}, 0 ${(-pLen).toFixed(1)} C ${(pWid * 0.75).toFixed(1)} ${(-pLen).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, 0 0 Z`,
              fill: '#FFFFFF',
              transform: `rotate(${deg.toFixed(1)})`
            });
            innerRing.appendChild(petal);
          }

          // Warm Golden-Yellow Center
          const halo = createSvgElement('circle', {
            cx: '0',
            cy: '0',
            r: (r * 0.26).toFixed(1),
            fill: '#F3C65F',
            opacity: '0.45'
          });
          const disk = createSvgElement('circle', {
            cx: '0',
            cy: '0',
            r: (r * 0.18).toFixed(1),
            fill: '#E5A93C'
          });
          coreGroup.appendChild(halo);
          coreGroup.appendChild(disk);
        } else {
          // Soft Blush Pink 5-Petal Blossom ('blush')
          const petalCount = 5;
          for (let i = 0; i < petalCount; i++) {
            const deg = (i * 360) / petalCount + (bloomRank % 5) * 11;
            const pLen = r * 0.95;
            const pWid = r * 0.54;
            const petal = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.32).toFixed(1)}, ${(-pWid * 0.9).toFixed(1)} ${(-pLen * 0.98).toFixed(1)}, 0 ${(-pLen * 0.92).toFixed(1)} C ${(pWid * 0.9).toFixed(1)} ${(-pLen * 0.98).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.32).toFixed(1)}, 0 0 Z`,
              fill: i % 2 === 0 ? '#FAD2DA' : '#F6B8C5',
              transform: `rotate(${deg.toFixed(1)})`
            });
            outerRing.appendChild(petal);
          }

          // Soft Deeper Blush Inner Flush
          for (let i = 0; i < petalCount; i++) {
            const deg = (i * 360) / petalCount + (bloomRank % 5) * 11;
            const pLen = r * 0.48;
            const pWid = r * 0.26;
            const innerFlush = createSvgElement('path', {
              d: `M 0 0 C ${(-pWid).toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, ${(-pWid * 0.6).toFixed(1)} ${(-pLen).toFixed(1)}, 0 ${(-pLen).toFixed(1)} C ${(pWid * 0.6).toFixed(1)} ${(-pLen).toFixed(1)}, ${pWid.toFixed(1)} ${(-pLen * 0.4).toFixed(1)}, 0 0 Z`,
              fill: '#E8839B',
              opacity: '0.75',
              transform: `rotate(${deg.toFixed(1)})`
            });
            innerRing.appendChild(innerFlush);
          }

          const coreCenter = createSvgElement('circle', {
            cx: '0',
            cy: '0',
            r: (r * 0.15).toFixed(1),
            fill: '#D65C7A'
          });
          coreGroup.appendChild(coreCenter);
        }

        localG.appendChild(outerRing);
        localG.appendChild(innerRing);
        localG.appendChild(coreGroup);
        rootG.appendChild(localG);
        return rootG;
      }

      /**
       * ============================================================================
       * HTML5 CANVAS ENGINE (DELTATIME, LERP, EASEINOUTCUBIC & SEPARATION PHYSICS)
       * Renders drifting flower petals, ambient motes, and twinkling night stars
       * ============================================================================
       */
      class AmbientCanvasEngine {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.lastTime = performance.now();

          this.petals = [];
          this.stars = [];
          this.sparkles = [];
          this.floatingNotes = [];

          // Smoothly interpolated physics parameters via lerp()
          this.targetSpeedMultiplier = 1.0;
          this.currentSpeedMultiplier = 1.0;
          this.targetPetalAlpha = 0.45;
          this.currentPetalAlpha = 0.45;
          this.targetNightBlend = 0.78;
          this.currentNightBlend = 0.78;

          this.pointer = { x: -9999, y: -9999 };
          this.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          this.resize();
          this.initEntities();
          this.bindEvents();
          requestAnimationFrame((t) => this.loop(t));
        }

        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        initEntities() {
          const petalColors = ['#FFB6D5', '#FFF5F8', '#F497B6', '#F0597A', '#A88BFF'];
          const petalCount = this.width < 768 ? 24 : 36;

          this.petals = Array.from({ length: petalCount }, (_, i) => ({
            id: i,
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            vx: (Math.random() - 0.5) * 18,
            vy: 16 + Math.random() * 20,
            size: 5.0 + Math.random() * 5.5,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 1.4,
            swayPhase: Math.random() * Math.PI * 2,
            color: petalColors[i % petalColors.length],
            radius: 26
          }));

          const starCount = this.width < 768 ? 68 : 120;
          const starColors = ['#FFF5F8', '#FFB6D5', '#A88BFF', '#FDE68A'];
          this.stars = Array.from({ length: starCount }, (_, i) => ({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            r: 0.6 + Math.random() * 1.7,
            phase: Math.random() * Math.PI * 2,
            speed: 0.7 + Math.random() * 1.9,
            color: starColors[i % starColors.length]
          }));

          // Tiny glowing particles & stardust drifting around the bouquet
          const sparkleCount = this.width < 768 ? 22 : 38;
          this.sparkles = Array.from({ length: sparkleCount }, (_, i) => ({
            x: this.width * (0.2 + Math.random() * 0.6),
            y: this.height * (0.15 + Math.random() * 0.7),
            r: 1.1 + Math.random() * 1.8,
            phase: Math.random() * Math.PI * 2,
            speed: 1.0 + Math.random() * 1.6,
            vy: -6 - Math.random() * 10,
            color: i % 2 === 0 ? '#FFB6D5' : '#A88BFF'
          }));

          // Floating micro-tags / firefly nodes that use Separation Algorithm
          const tagLabels = ['🌙 Ngủ sớm nhé', '💗 Anh thương em', '✨ Mơ đẹp nha', '🌸 Ngoan nhé'];
          this.floatingNotes = tagLabels.map((text, idx) => ({
            id: idx,
            text,
            x: this.width * (0.18 + idx * 0.22),
            y: this.height * (0.2 + (idx % 2) * 0.45),
            targetX: this.width * (0.18 + idx * 0.22),
            targetY: this.height * (0.2 + (idx % 2) * 0.45),
            vx: 0,
            vy: 0,
            radius: 75,
            phase: idx * 1.5
          }));
        }

        bindEvents() {
          window.addEventListener('resize', () => this.resize());
          window.addEventListener('pointermove', (e) => {
            this.pointer.x = e.clientX;
            this.pointer.y = e.clientY;
          });
        }

        setStageMode({ petalsActive, nightMode }) {
          this.targetPetalAlpha = petalsActive ? 0.92 : 0.45;
          this.targetNightBlend = nightMode ? 1.0 : 0.78;
          // Slow down floating petals gracefully in night mode
          this.targetSpeedMultiplier = nightMode ? 0.38 : 1.0;
        }

        loop(now) {
          const deltaTime = clamp((now - this.lastTime) / 1000, 0.001, 0.05);
          this.lastTime = now;

          this.update(deltaTime, now / 1000);
          this.draw(now / 1000);

          requestAnimationFrame((t) => this.loop(t));
        }

        update(deltaTime, elapsedSec) {
          // Smoothly interpolate global state using lerp()
          this.currentPetalAlpha = lerp(this.currentPetalAlpha, this.targetPetalAlpha, deltaTime * 2.2);
          this.currentNightBlend = lerp(this.currentNightBlend, this.targetNightBlend, deltaTime * 1.6);
          this.currentSpeedMultiplier = lerp(
            this.currentSpeedMultiplier,
            this.targetSpeedMultiplier,
            deltaTime * 2.0
          );

          if (this.reducedMotion) return;

          const speedMult = this.currentSpeedMultiplier;

          // 1. Update Petals with DeltaTime, EaseInOutCubic wind wave & Separation Algorithm
          for (let i = 0; i < this.petals.length; i++) {
            const p = this.petals[i];
            p.swayPhase += deltaTime * 1.1 * speedMult;
            const waveT = (Math.sin(p.swayPhase) + 1) * 0.5;
            const easedWave = easeInOutCubic(waveT) - 0.5;

            // Separation force between petals so they never overlap unnaturally
            let sepX = 0;
            let sepY = 0;
            for (let j = 0; j < this.petals.length; j++) {
              if (i === j) continue;
              const other = this.petals[j];
              const dx = p.x - other.x;
              const dy = p.y - other.y;
              const dist = Math.hypot(dx, dy);
              const minSep = p.radius + other.radius;
              if (dist > 0 && dist < minSep) {
                const force = (minSep - dist) / minSep;
                sepX += (dx / dist) * force * 24;
                sepY += (dy / dist) * force * 24;
              }
            }

            // Gentle pointer interaction repulsion
            const pdx = p.x - this.pointer.x;
            const pdy = p.y - this.pointer.y;
            const pDist = Math.hypot(pdx, pdy);
            if (pDist > 0 && pDist < 95) {
              const push = (95 - pDist) / 95;
              sepX += (pdx / pDist) * push * 45;
              sepY += (pdy / pDist) * push * 45;
            }

            const desiredVx = easedWave * 28 + sepX;
            const desiredVy = (18 + (p.id % 5) * 3.5) * speedMult + sepY;

            p.vx = lerp(p.vx, desiredVx, deltaTime * 3.0);
            p.vy = lerp(p.vy, desiredVy, deltaTime * 3.0);

            p.x += p.vx * deltaTime;
            p.y += p.vy * deltaTime;
            p.rot += p.vRot * deltaTime * speedMult;

            // Wrap around screen boundaries cleanly
            if (p.y > this.height + 24) {
              p.y = -20;
              p.x = Math.random() * this.width;
            }
            if (p.x < -25) p.x = this.width + 20;
            if (p.x > this.width + 25) p.x = -20;
          }

          // 2. Update Floating Whisper Tags with Separation Algorithm
          for (let i = 0; i < this.floatingNotes.length; i++) {
            const n = this.floatingNotes[i];
            n.phase += deltaTime * 0.55;
            const anchorX = this.width * (0.14 + i * 0.24);
            const anchorY = this.height * (0.16 + (i % 2) * 0.52) + Math.sin(n.phase) * 14;

            let sepX = 0;
            let sepY = 0;
            for (let j = 0; j < this.floatingNotes.length; j++) {
              if (i === j) continue;
              const o = this.floatingNotes[j];
              const dx = n.x - o.x;
              const dy = n.y - o.y;
              const dist = Math.hypot(dx, dy);
              const minSep = n.radius + o.radius;
              if (dist > 0 && dist < minSep) {
                const f = (minSep - dist) / minSep;
                sepX += (dx / dist) * f * 60;
                sepY += (dy / dist) * f * 60;
              }
            }

            n.x = lerp(n.x, anchorX + sepX, deltaTime * 2.4);
            n.y = lerp(n.y, anchorY + sepY, deltaTime * 2.4);
          }

          // 3. Update Glowing Stardust Sparkles around the Bouquet
          for (let i = 0; i < this.sparkles.length; i++) {
            const sp = this.sparkles[i];
            sp.phase += deltaTime * sp.speed;
            sp.y += sp.vy * deltaTime * speedMult;
            sp.x += Math.sin(sp.phase) * 8 * deltaTime;
            if (sp.y < this.height * 0.08) {
              sp.y = this.height * 0.85;
              sp.x = this.width * (0.2 + Math.random() * 0.6);
            }
          }
        }

        draw(elapsedSec) {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, this.width, this.height);

          // 1. Draw Distant Galaxy Stars & Twinkling Constellations
          for (let i = 0; i < this.stars.length; i++) {
            const s = this.stars[i];
            const twinkle = 0.3 + 0.7 * ((Math.sin(elapsedSec * s.speed + s.phase) + 1) * 0.5);
            ctx.save();
            ctx.globalAlpha = twinkle * this.currentNightBlend;
            ctx.fillStyle = s.color;
            if (s.r > 1.5) {
              ctx.shadowColor = s.color;
              ctx.shadowBlur = 6;
            }
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 2. Draw Tiny Glowing Stardust Particles around the Bouquet
          for (let i = 0; i < this.sparkles.length; i++) {
            const sp = this.sparkles[i];
            const pulse = 0.25 + 0.75 * ((Math.sin(elapsedSec * sp.speed + sp.phase) + 1) * 0.5);
            ctx.save();
            ctx.globalAlpha = pulse * 0.82;
            ctx.fillStyle = sp.color;
            ctx.shadowColor = sp.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 3. Draw Drifting Flower Petals
          if (this.currentPetalAlpha > 0.02) {
            for (let i = 0; i < this.petals.length; i++) {
              const p = this.petals[i];
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.globalAlpha = this.currentPetalAlpha * (0.65 + (i % 3) * 0.1);
              ctx.fillStyle = p.color;

              if (this.currentNightBlend > 0.3) {
                ctx.shadowColor = 'rgba(244, 143, 177, 0.45)';
                ctx.shadowBlur = 8 * this.currentNightBlend;
              }

              ctx.beginPath();
              ctx.moveTo(0, -p.size);
              ctx.bezierCurveTo(
                p.size * 0.85,
                -p.size * 0.7,
                p.size * 0.75,
                p.size * 0.7,
                0,
                p.size
              );
              ctx.bezierCurveTo(
                -p.size * 0.75,
                p.size * 0.7,
                -p.size * 0.85,
                -p.size * 0.7,
                0,
                -p.size
              );
              ctx.fill();
              ctx.restore();
            }
          }
        }
      }

      /**
       * ============================================================================
       * TIMELINE & INTERACTION CONTROLLER
       * Manages the 5 blooming stages, romantic message reveal, and midnight scene
       * ============================================================================
       */
      class BloomExperienceController {
        constructor(canvasEngine) {
          this.canvasEngine = canvasEngine;
          this.timers = [];
          this.isTransitioningToSleep = false;

          // DOM Elements
          this.stageLabel = document.getElementById('stage-status-label');
          this.whisperPill = document.getElementById('stage-whisper-pill');
          this.bouquetShowcase = document.getElementById('bouquet-showcase');
          this.bouquetSvg = document.getElementById('bouquet-svg');
          this.cardBadge = document.getElementById('card-badge-text');
          this.cardClock = document.getElementById('card-clock-display');
          this.messageHeading = document.getElementById('message-heading');
          this.messageBody = document.getElementById('message-body');
          this.cardActions = document.getElementById('card-actions');
          this.confirmSleepBtn = document.getElementById('confirm-sleep-btn');
          this.restartBtn = document.getElementById('restart-experience-btn');
          this.topReplayBtn = document.getElementById('top-replay-btn');
          this.themeColorMeta = document.getElementById('theme-color-meta');

          this.updateLiveClock();
          setInterval(() => this.updateLiveClock(), 15000);

          this.bindControls();
          this.startSequence();
        }

        updateLiveClock() {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          if (this.cardClock) {
            this.cardClock.textContent = `${hh}:${mm}`;
          }
        }

        clearAllTimers() {
          while (this.timers.length > 0) {
            clearTimeout(this.timers.pop());
          }
        }

        schedule(fn, delayMs) {
          const id = setTimeout(fn, delayMs);
          this.timers.push(id);
          return id;
        }

        bindControls() {
          this.confirmSleepBtn.addEventListener('click', () => {
            this.triggerGoodnightScene();
          });

          this.restartBtn.addEventListener('click', () => {
            this.startSequence();
          });

          this.topReplayBtn.addEventListener('click', () => {
            this.startSequence();
          });
        }

        resetVisualState() {
          this.clearAllTimers();
          this.isTransitioningToSleep = false;

          document.body.classList.remove('is-night');
          this.themeColorMeta.setAttribute('content', '#080D24');

          this.bouquetShowcase.classList.remove('aura-visible');
          this.bouquetSvg.classList.remove('swaying');

          // Reset SVG animated elements
          document
            .querySelectorAll(
              '.wrapper-cone-group, .backdrop-foliage-leaf, .stem-path, .stem-leaf-item, .wheat-sprig-item, .flower-bud-node, .flower-head-node'
            )
            .forEach((el) => {
              el.classList.remove('active', 'bloomed');
            });

          // Reset Whisper Pill & Card UI
          this.whisperPill.textContent = CONFIG.introWhisper;
          this.whisperPill.classList.add('visible');

          this.cardBadge.textContent = CONFIG.romanticMessage.badge;
          this.messageHeading.textContent = 'Anh có một món quà nhỏ dành cho em...';
          this.messageBody.innerHTML = '';

          this.confirmSleepBtn.disabled = false;
          this.confirmSleepBtn.classList.remove('hidden');
          this.confirmSleepBtn.querySelector('span').textContent =
            CONFIG.romanticMessage.confirmButtonText;
          this.restartBtn.classList.add('hidden');
          this.cardActions.classList.remove('ready');

          this.canvasEngine.setStageMode({ petalsActive: false, nightMode: false });
        }

        renderProgressNote(text) {
          this.messageBody.innerHTML = '';
          const p = document.createElement('p');
          p.className = 'msg-para';
          p.textContent = text;
          this.messageBody.appendChild(p);
          requestAnimationFrame(() => p.classList.add('revealed'));
        }

        startSequence() {
          this.resetVisualState();
          const t = CONFIG.timings;

          // STAGE 1: The Beginning — Empty Bouquet Wrapper & Intro Whisper
          this.stageLabel.textContent = CONFIG.stageLabels.stage1;
          this.schedule(() => {
            document.querySelectorAll('.wrapper-cone-group').forEach((el) => {
              el.classList.add('active');
            });
            this.renderProgressNote(CONFIG.bloomingProgressMessages[0]);
          }, t.stage1WrapperMs);

          // STAGE 2: Growing Stems & Leaves
          this.schedule(() => {
            this.stageLabel.textContent = CONFIG.stageLabels.stage2;
            document.querySelectorAll('.backdrop-foliage-leaf, .stem-path').forEach((el) => {
              el.classList.add('active');
            });
            document.querySelectorAll('.stem-leaf-item, .wheat-sprig-item').forEach((el) => {
              el.classList.add('active');
            });
          }, t.stage2StemsMs);

          // STAGE 3: Flower Buds Appear at Stem Tips
          this.schedule(() => {
            this.stageLabel.textContent = CONFIG.stageLabels.stage3;
            this.renderProgressNote(CONFIG.bloomingProgressMessages[1]);
            document.querySelectorAll('.flower-bud-node').forEach((el) => {
              el.classList.add('active');
            });
          }, t.stage3BudsMs);

          // STAGE 4: Individual Flowers Bloom from Center Outward
          this.schedule(() => {
            this.stageLabel.textContent = CONFIG.stageLabels.stage4;
            this.renderProgressNote(CONFIG.bloomingProgressMessages[2]);
            document.querySelectorAll('.flower-bud-node').forEach((el) => {
              el.classList.add('bloomed');
            });
            document.querySelectorAll('.flower-head-node').forEach((el) => {
              el.classList.add('active');
            });
          }, t.stage4BloomMs);

          // STAGE 5: Complete Bouquet + Floating Petals + Romantic Vietnamese Message
          this.schedule(() => {
            this.stageLabel.textContent = CONFIG.stageLabels.stage5;
            this.bouquetShowcase.classList.add('aura-visible');
            this.bouquetSvg.classList.add('swaying');
            this.whisperPill.classList.remove('visible');

            this.canvasEngine.setStageMode({ petalsActive: true, nightMode: false });
            this.revealRomanticMessage();
          }, t.stage5CompleteMs);
        }

        revealRomanticMessage() {
          this.messageHeading.textContent = CONFIG.romanticMessage.heading;
          this.messageBody.innerHTML = '';

          const paras = CONFIG.romanticMessage.paragraphs;
          paras.forEach((text, idx) => {
            const p = document.createElement('p');
            p.className =
              idx === paras.length - 1 ? 'msg-para highlight-love' : 'msg-para';
            p.textContent = text;
            this.messageBody.appendChild(p);

            this.schedule(() => {
              p.classList.add('revealed');
            }, 150 + idx * CONFIG.timings.paragraphStaggerMs);
          });

          const totalRevealDelay = 250 + paras.length * CONFIG.timings.paragraphStaggerMs;
          this.schedule(() => {
            this.cardActions.classList.add('ready');
          }, totalRevealDelay);
        }

        triggerGoodnightScene() {
          // 1. Prevent accidental duplicate clicks during transition
          if (this.isTransitioningToSleep) return;
          this.isTransitioningToSleep = true;
          this.confirmSleepBtn.disabled = true;

          // 2 & 3. Make bouquet glow softly & slow down floating petals
          document.body.classList.add('is-night');
          this.themeColorMeta.setAttribute('content', '#080D24');
          this.stageLabel.textContent = CONFIG.stageLabels.night;
          this.canvasEngine.setStageMode({ petalsActive: true, nightMode: true });

          // 4. Fade message out gently and transition to goodnight message
          this.cardActions.classList.remove('ready');
          this.messageBody.querySelectorAll('.msg-para').forEach((p) => {
            p.classList.remove('revealed');
          });

          // 5 & 6. Display peaceful midnight message + "Xem lại từ đầu" button
          this.schedule(() => {
            this.cardBadge.textContent = CONFIG.goodnightMessage.badge;
            this.messageHeading.textContent = CONFIG.goodnightMessage.heading;
            this.messageBody.innerHTML = '';

            CONFIG.goodnightMessage.paragraphs.forEach((line, idx) => {
              const p = document.createElement('p');
              p.className = 'msg-para highlight-love';
              p.textContent = line;
              this.messageBody.appendChild(p);

              this.schedule(() => {
                p.classList.add('revealed');
              }, 160 + idx * 350);
            });

            this.confirmSleepBtn.classList.add('hidden');
            this.restartBtn.querySelector('span').textContent =
              CONFIG.goodnightMessage.restartButtonText;
            this.restartBtn.classList.remove('hidden');

            this.schedule(() => {
              this.cardActions.classList.add('ready');
            }, 450);
          }, 550);
        }
      }

      // Initialize Bouquet SVG, Canvas Physics Engine, and Stage Controller on DOM Ready
      document.addEventListener('DOMContentLoaded', () => {
        buildBouquetSvg();
        const canvasEl = document.getElementById('ambient-canvas');
        const canvasEngine = new AmbientCanvasEngine(canvasEl);
        new BloomExperienceController(canvasEngine);
      });
    </script>
  </body>
</html>
